<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2A36"/>
      <stop offset="1" stop-color="#14403F"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- chart motif -->
  <g transform="translate(790 70)">
    <g fill="#1E7F74">
      <rect x="0" y="110" width="34" height="50" rx="4" opacity="0.55"/>
      <rect x="50" y="80" width="34" height="80" rx="4" opacity="0.65"/>
      <rect x="100" y="95" width="34" height="65" rx="4" opacity="0.75"/>
      <rect x="150" y="50" width="34" height="110" rx="4" opacity="0.85"/>
      <rect x="200" y="30" width="34" height="130" rx="4"/>
      <rect x="250" y="10" width="34" height="150" rx="4" fill="#2BB39F"/>
    </g>
    <polyline points="17,95 67,62 117,75 167,32 217,14 267,-6" fill="none" stroke="#F2C811" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#F2C811">
      <circle cx="17" cy="95" r="5"/><circle cx="67" cy="62" r="5"/><circle cx="117" cy="75" r="5"/>
      <circle cx="167" cy="32" r="5"/><circle cx="217" cy="14" r="5"/><circle cx="267" cy="-6" r="6"/>
    </g>
    <line x1="-10" y1="160" x2="300" y2="160" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="70" y="92" fill="#7FD1C3" font-size="18" font-weight="600" letter-spacing="3">DATA ANALYST · WEB DEVELOPER</text>
    <text x="68" y="158" fill="#ffffff" font-size="62" font-weight="700">Waqar Azeem</text>
    <text x="70" y="202" fill="#C9D6DC" font-size="22">Dashboards, reporting &amp; data tools for finance teams</text>
    <g font-size="16" fill="#9FB3BC">
      <circle cx="76" cy="244" r="5" fill="#2BB39F"/><text x="90" y="250">Riyadh, Saudi Arabia</text>
      <text x="290" y="250">Power BI · SQL · Python · Excel · JavaScript</text>
    </g>
  </g>
</svg>
