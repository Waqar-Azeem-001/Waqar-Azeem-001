    <rect x="0" y="0" width="12" height="170" fill="#1E7F74" clip-path="url(#c)"/>
    <text x="34" y="74"><tspan class="n">50</tspan><tspan class="u">+</tspan></text>
    <text x="34" y="108" class="l">DASHBOARDS &amp; TOOLS</text>
