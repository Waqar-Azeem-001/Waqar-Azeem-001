    .l{font:600 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#14403F;letter-spacing:1.5px}
    .s{font:400 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#5B6F77}
  </style>
  <defs><clipPath id="c"><rect x="2" y="2" width="282" height="166" rx="16"/></clipPath></defs>
